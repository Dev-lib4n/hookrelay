services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hookrelay-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-hookrelay}
      DB_USERNAME: ${DB_USERNAME:-hookrelay}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      CACHE_STORE: ${CACHE_STORE:-redis}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hookrelay-network

  nginx:
    image: nginx:1.27-alpine
    container_name: hookrelay-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - hookrelay-network

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hookrelay-horizon
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan horizon
    stop_grace_period: 30s
    volumes:
      - ./:/var/www/html
    environment:
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-hookrelay}
      DB_USERNAME: ${DB_USERNAME:-hookrelay}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      CACHE_STORE: ${CACHE_STORE:-redis}
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hookrelay-network

  postgres:
    image: postgres:16-alpine
    container_name: hookrelay-postgres
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-hookrelay}
      POSTGRES_USER: ${DB_USERNAME:-hookrelay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-hookrelay} -d ${DB_DATABASE:-hookrelay}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hookrelay-network

  redis:
    image: redis:7-alpine
    container_name: hookrelay-redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - hookrelay-network

networks:
  hookrelay-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
